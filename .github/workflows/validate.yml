name: Validate data

on:
  pull_request:
    paths:
      - 'data.js'
      - 'schema/**'
      - 'scripts/validate.mjs'
  push:
    branches: [main]
    paths:
      - 'data.js'
      - 'schema/**'
      - 'scripts/validate.mjs'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm ci
      - run: npm run validate
